# Configuration for yamllint (run by .github/workflows/workflow-yamllint.yml via `make yamllint`).
extends: default

ignore:
  - vendor/
  - dist/
  - .tools/venv/ # gitignored python venv, yamllint's own bundled configs live in here

rules:
  comments:
    min-spaces-from-content: 1 # repo style is a single space before trailing comments
  indentation:
    spaces: 2
    indent-sequences: true
  octal-values: # bare 0644 is octal in YAML 1.1 but decimal in 1.2; force the unambiguous quoted form
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false # 'on:' in workflows is a key, not a YAML 1.1 boolean
  brackets:
    max-spaces-inside: 1 # allow the existing `[ 'main' ]` style
