---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # dependabot auto-detects the vendor/ directory and runs `go mod tidy` + `go mod vendor` on updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns:
          - "*"

  # dev tools (actionlint, golangci-lint, gofumpt) pinned in .tools/go.mod; tools move slowly,
  # so only check quarterly
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns:
          - "*"
