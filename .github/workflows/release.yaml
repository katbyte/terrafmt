---
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser uploads the release and its assets
      id-token: write # cosign keyless signing and attestation signing via OIDC
      attestations: write # actions/attest-build-provenance stores attestations
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog and version from tag history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: export artifact hashes for slsa provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 < ./dist/checksums.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt # attest every artifact goreleaser published

  provenance:
    needs: goreleaser
    permissions:
      actions: read # read the workflow run to record the build context
      id-token: write # sign the provenance
      contents: write # upload multiple.intoto.jsonl to the release
    # the slsa builder must be referenced by tag, not commit hash; it verifies its own ref at runtime
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: update tap formula (source build)
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./scripts/update-homebrew-formula.sh

  # the binary scan (main-binary-scan.yaml) goes red on main when the published release has a known
  # vulnerability, and only a release can clear it. rerun the failed jobs of the scan runs on main's head so
  # the red check runs are replaced in place; a fresh run from a new event would sit beside them and the
  # commit would stay red
  rescan:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      actions: write # rerun workflow jobs
    steps:
      - name: rerun the failed binary scan jobs on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          runs=$(gh run list -w main-binary-scan.yaml -c "$head" --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "failure") | .databaseId')
          if [ -z "$runs" ]; then echo "no failed binary scan on main ($head), nothing to rerun"; exit 0; fi
          for run in $runs; do echo "rerunning failed jobs of $run"; gh run rerun "$run" --failed; done
